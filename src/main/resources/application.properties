spring.application.name=cms-new


spring.datasource.url=jdbc:mysql://localhost:3306/docuterm?serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Store/read timestamps as UTC in Hibernate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
server.servlet.session.timeout=2h


spring.thymeleaf.cache=false
spring.devtools.restart.enabled=true