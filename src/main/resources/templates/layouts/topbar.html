<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">


<!-- ===== TOPBAR (partial) ===== -->
<header th:fragment="topbarId" class="topbar">
  <button class="icon-btn" id="sbToggle" title="Menu"><i class="bi bi-list fs-5"></i></button>
  <div class="d-flex align-items-center gap-1">
    <button class="icon-btn" title="Search"><i class="bi bi-search"></i></button>
    <button class="icon-btn" title="Notifications"><i class="bi bi-bell"></i><span class="dot"></span></button>
    <div class="dropdown">
      <button class="icon-btn" data-bs-toggle="dropdown" data-bs-offset="0,4" title="Account"><i class="bi bi-person-circle fs-6"></i></button>
      <div class="dropdown-menu dropdown-menu-end">
        <div class="px-2 py-1 small"><b>Admin User</b><br><span class="text-muted">admin@company.com</span></div>
        <div class="dropdown-divider"></div>
        <a class="dropdown-item" href="#"><i class="bi bi-person me-2"></i>Profile</a>
        <a class="dropdown-item" href="#"><i class="bi bi-gear me-2"></i>Settings</a>
        <div class="p-1 pt-2">
        <form th:action="@{/logout}" method="POST">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <button type="submit" class="btn btn-danger w-100 btn-logout">
        <i class="bi bi-box-arrow-right me-1">
        	</i>Logout</button>
        </form>
        
        </div>
      </div>
    </div>
  </div>
</header>
