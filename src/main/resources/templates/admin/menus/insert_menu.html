<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/app :: layout(~{::title}, ~{::main}, ~{::script})}" >
<head>
<meta charset="UTF-8">
<title>Menus</title>
</head>
<body>


<main class="content">
<div class="d-flex justify-content-between align-items-center mb-2">
  <h1 class="page-title">Form Page</h1>
  <nav><ol class="breadcrumb"><li class="breadcrumb-item"><a href="#">Home</a></li><li class="breadcrumb-item active">Form</li></ol></nav>
</div>
<div class="card">
  <div class="card-header"><i class="bi bi-pencil-square"></i> Add Record</div>
  <div class="card-body">
    <form id="demoForm" class="needs-validation" novalidate>
      <div class="row g-2">
        <div class="col-md-4"><label class="form-label">Full Name</label>
          <div class="input-group"><span class="input-group-text"><i class="bi bi-person"></i></span><input type="text" class="form-control" name="name" required></div></div>
        <div class="col-md-4"><label class="form-label">Email</label>
          <div class="input-group"><span class="input-group-text"><i class="bi bi-envelope"></i></span><input type="email" class="form-control" name="email" required></div></div>
        <div class="col-md-4"><label class="form-label">Mobile</label>
          <div class="input-group"><span class="input-group-text"><i class="bi bi-telephone"></i></span><input type="tel" class="form-control" name="mobile"></div></div>
        <div class="col-md-3"><label class="form-label">Date</label><input type="date" class="form-control" name="date"></div>
        <div class="col-md-3"><label class="form-label">Category</label>
          <select class="form-select select2" name="cat" data-placeholder="Select category" required><option></option><option>Student</option><option>Teacher</option><option>Staff</option><option>Parent</option></select></div>
        <div class="col-md-3"><label class="form-label">Amount</label>
          <div class="input-group"><span class="input-group-text"><i class="bi bi-currency-rupee"></i></span><input type="number" class="form-control" name="amount"></div></div>
        <div class="col-md-3"><label class="form-label">File</label><input type="file" class="form-control" name="file"></div>
        <div class="col-md-6"><label class="form-label">Tags (multi select)</label><select class="form-select select2" name="tags[]" multiple data-placeholder="Select tags"><option>PHP</option><option>Laravel</option><option>CodeIgniter</option><option>MySQL</option><option>JavaScript</option></select></div>
        <div class="col-md-6"><label class="form-label">Address</label><textarea class="form-control" rows="2" name="address"></textarea></div>
        <div class="col-12 d-flex gap-3">
          <div class="form-check"><input class="form-check-input" type="checkbox" id="c1"><label class="form-check-label" for="c1">Remember</label></div>
          <div class="form-check form-switch"><input class="form-check-input" type="checkbox" id="s1" checked><label class="form-check-label" for="s1">Active</label></div>
        </div>
      </div>
      <hr class="my-2">
      <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i>Save</button>
      <button type="reset" class="btn btn-outline-secondary"><i class="bi bi-arrow-counterclockwise me-1"></i>Reset</button>
    </form>
  </div>
</div>
</main>

<script>
$('#demoForm').on('submit',function(e){
  e.preventDefault();                        // remove this line for a real submit
  if(!this.checkValidity()){ $(this).addClass('was-validated'); return; }
  App.toast('success','Saved successfully'); // or Swal.fire(...)
});
</script>

</body>
</html>
